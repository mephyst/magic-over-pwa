<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generatore Codici - Magic Over</title>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 100%);
            color: #eee;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        h1 {
            color: #00d26a;
            margin-bottom: 10px;
            text-align: center;
        }
        .subtitle {
            text-align: center;
            opacity: 0.7;
            margin-bottom: 30px;
        }
        .card {
            background: rgba(255,255,255,0.05);
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }
        .input-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.9rem;
            opacity: 0.8;
        }
        input, select {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(255,255,255,0.1);
            color: #fff;
            font-size: 1rem;
        }
        input:focus {
            outline: none;
            border-color: #00d26a;
            background: rgba(255,255,255,0.15);
        }
        input::placeholder {
            color: rgba(255,255,255,0.4);
        }
        button {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.02); }
        .btn-primary { background: #00d26a; color: #000; }
        .btn-danger { background: #ff4757; color: #fff; }
        .btn-secondary { background: rgba(255,255,255,0.2); color: #fff; }
        .code-item {
            background: rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            flex-wrap: wrap;
            gap: 15px;
        }
        .code-text {
            font-family: 'Courier New', monospace;
            font-size: 1.1rem;
            color: #00d26a;
            font-weight: bold;
            letter-spacing: 1px;
        }
        .code-status {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: bold;
        }
        .status-available { background: #00d26a; color: #000; }
        .status-used { background: #ffa502; color: #000; }
        .status-revoked { background: #ff4757; color: #fff; }
        .copy-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            padding: 8px 16px;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            margin-left: 10px;
        }
        .copy-btn:hover { background: rgba(255,255,255,0.3); }
        .alert {
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 20px;
        }
        .alert-success {
            background: rgba(0, 210, 106, 0.2);
            border: 1px solid #00d26a;
            color: #00d26a;
        }
        .alert-danger {
            background: rgba(255, 71, 87, 0.2);
            border: 1px solid #ff4757;
            color: #ff4757;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔑 Generatore Codici Magic Over</h1>
        <div class="subtitle">Pannello Amministratore</div>

        <div class="card">
            <h3 style="margin-bottom: 15px;">Genera Nuovi Codici</h3>
            <div class="input-group">
                <label>Numero di codici da generare</label>
                <input type="number" id="numCodes" value="5" min="1" max="50">
            </div>
            <div class="input-group">
                <label>Nome utente (opzionale - puoi aggiungerlo dopo)</label>
                <input type="text" id="userName" placeholder="Lascia vuoto per compilarlo dopo...">
            </div>
            <button class="btn-primary" onclick="generateCodes()">Genera Codici</button>
        </div>

        <div id="alert"></div>

        <div class="card">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
                <h3>Codici Generati</h3>
                <button class="btn-secondary" onclick="loadAllCodes()" style="width: auto; padding: 10px 20px;">
                    🔄 Aggiorna
                </button>
            </div>
            <div id="codesList"></div>
        </div>
    </div>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyDnKMAKN1FK9ZLese-XoUuY6a2MPsuDS74",
            authDomain: "magic-over-auth.firebaseapp.com",
            databaseURL: "https://magic-over-auth-default-rtdb.europe-west1.firebasedatabase.app",
            projectId: "magic-over-auth",
            storageBucket: "magic-over-auth.firebasestorage.app",
            messagingSenderId: "413812907152",
            appId: "1:413812907152:web:6447156f262615a7e58c15"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Generate random code
        function generateRandomCode() {
            const chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789'; // Esclusi O, 0, I, 1 per evitare confusione
            let code = 'MAGIC';

            for (let i = 0; i < 2; i++) {
                code += '-';
                for (let j = 0; j < 4; j++) {
                    code += chars.charAt(Math.floor(Math.random() * chars.length));
                }
            }

            return code;
        }

        // Generate codes
        async function generateCodes() {
            const numCodes = parseInt(document.getElementById('numCodes').value);
            const userName = document.getElementById('userName').value.trim();

            if (numCodes < 1 || numCodes > 50) {
                showAlert('Inserisci un numero tra 1 e 50', 'danger');
                return;
            }

            const generatedCodes = [];

            try {
                for (let i = 0; i < numCodes; i++) {
                    let code = generateRandomCode();

                    // Verifica che il codice non esista già
                    let exists = true;
                    let attempts = 0;

                    while (exists && attempts < 10) {
                        const snapshot = await db.ref('codes/' + code).once('value');
                        if (!snapshot.exists()) {
                            exists = false;
                        } else {
                            code = generateRandomCode();
                            attempts++;
                        }
                    }

                    if (attempts >= 10) {
                        console.error('Troppi tentativi per generare codice unico');
                        continue;
                    }

                    // Salva il codice
                    await db.ref('codes/' + code).set({
                        createdAt: new Date().toISOString(),
                        userName: userName || null,
                        activatedAt: null,
                        deviceId: null,
                        deviceCount: 0,
                        revoked: false
                    });

                    generatedCodes.push(code);
                }

                showAlert(`✅ ${generatedCodes.length} codici generati con successo!`, 'success');

                // Mostra i codici generati
                let codesText = generatedCodes.join('\n');
                console.log('Codici generati:\n' + codesText);

                // Reload list
                loadAllCodes();

            } catch (error) {
                console.error('Errore:', error);
                showAlert('❌ Errore nella generazione dei codici: ' + error.message, 'danger');
            }
        }

        // Load all codes
        async function loadAllCodes() {
            try {
                const snapshot = await db.ref('codes').once('value');
                const codes = snapshot.val();

                const codesList = document.getElementById('codesList');

                if (!codes) {
                    codesList.innerHTML = '<p style="text-align: center; opacity: 0.6;">Nessun codice generato</p>';
                    return;
                }

                let html = '';
                const sortedCodes = Object.entries(codes).sort((a, b) => {
                    const dateA = new Date(a[1].createdAt);
                    const dateB = new Date(b[1].createdAt);
                    return dateB - dateA;
                });

                sortedCodes.forEach(([code, data]) => {
                    let status = 'available';
                    let statusText = 'Disponibile';

                    if (data.revoked) {
                        status = 'revoked';
                        statusText = 'Revocato';
                    } else if (data.activatedAt) {
                        status = 'used';
                        statusText = 'In uso';
                    }

                    const currentName = data.userName || '';

                    html += `
                        <div class="code-item">
                            <div style="flex: 1;">
                                <div class="code-text">${code}</div>
                                <div style="margin-top: 8px; display: flex; align-items: center; gap: 10px;">
                                    <div style="position: relative; flex: 1; max-width: 250px;">
                                        <input
                                            type="text"
                                            id="name-${code}"
                                            value="${currentName}"
                                            placeholder="Aggiungi nome..."
                                            style="
                                                width: 100%;
                                                padding: 6px 10px;
                                                font-size: 0.85rem;
                                                background: rgba(255,255,255,0.05);
                                                border: 1px solid rgba(255,255,255,0.2);
                                                border-radius: 6px;
                                                color: #fff;
                                            "
                                            onchange="updateUserName('${code}', this.value)"
                                        />
                                        <span id="saved-${code}" style="
                                            position: absolute;
                                            right: 10px;
                                            top: 50%;
                                            transform: translateY(-50%);
                                            color: #00d26a;
                                            font-size: 0.9rem;
                                            display: none;
                                        ">✓</span>
                                    </div>
                                    <span style="font-size: 0.75rem; opacity: 0.6;">
                                        ${data.activatedAt ? '• Attivato: ' + new Date(data.activatedAt).toLocaleDateString('it-IT') : ''}
                                    </span>
                                </div>
                            </div>
                            <div style="display: flex; gap: 10px; align-items: center; flex-shrink: 0;">
                                <span class="code-status status-${status}">${statusText}</span>
                                <button class="copy-btn" onclick="copyCode('${code}')">📋 Copia</button>
                                ${status === 'used' && !data.revoked ? `<button class="copy-btn" onclick="resetCode('${code}')" style="background: rgba(255,165,2,0.3);">🔄 Reset</button>` : ''}
                                ${!data.revoked ? `<button class="copy-btn" onclick="revokeCode('${code}')" style="background: rgba(255,71,87,0.3);">🚫 Revoca</button>` : ''}
                            </div>
                        </div>
                    `;
                });

                codesList.innerHTML = html;

            } catch (error) {
                console.error('Errore caricamento codici:', error);
                showAlert('❌ Errore nel caricamento dei codici', 'danger');
            }
        }

        // Update user name
        async function updateUserName(code, newName) {
            const trimmedName = newName.trim();
            const savedIcon = document.getElementById('saved-' + code);

            try {
                await db.ref('codes/' + code).update({
                    userName: trimmedName || null
                });

                // Mostra checkmark
                if (savedIcon) {
                    savedIcon.style.display = 'inline';
                    setTimeout(() => {
                        savedIcon.style.display = 'none';
                    }, 2000);
                }

                showAlert(`✅ Nome "${trimmedName || 'vuoto'}" salvato per ${code}`, 'success');
            } catch (error) {
                console.error('Errore aggiornamento nome:', error);
                showAlert('❌ Errore nell\'aggiornamento del nome', 'danger');
            }
        }

        // Copy code to clipboard
        function copyCode(code) {
            navigator.clipboard.writeText(code).then(() => {
                showAlert(`📋 Codice ${code} copiato!`, 'success');
            });
        }

        // Reset code (for users who made mistakes during activation)
        async function resetCode(code) {
            if (!confirm(`Vuoi resettare il codice ${code}?\n\nQuesta operazione:\n• Cancellerà l'attivazione corrente\n• Permetterà all'utente di riutilizzare il codice\n• Non eliminerà il nome utente associato\n\nContinuare?`)) {
                return;
            }

            try {
                await db.ref('codes/' + code).update({
                    activatedAt: null,
                    deviceId: null,
                    deviceCount: 0
                });
                showAlert(`✅ Codice ${code} resettato e pronto per essere riutilizzato`, 'success');
                loadAllCodes();
            } catch (error) {
                console.error('Errore reset codice:', error);
                showAlert('❌ Errore nel reset del codice', 'danger');
            }
        }

        // Revoke code
        async function revokeCode(code) {
            if (!confirm(`Vuoi davvero revocare il codice ${code}?\nL'utente non potrà più accedere.`)) {
                return;
            }

            try {
                await db.ref('codes/' + code).update({
                    revoked: true,
                    revokedAt: new Date().toISOString()
                });
                showAlert(`✅ Codice ${code} revocato`, 'success');
                loadAllCodes();
            } catch (error) {
                showAlert('❌ Errore nella revoca del codice', 'danger');
            }
        }

        // Show alert
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.innerHTML = `<div class="alert alert-${type}">${message}</div>`;
            setTimeout(() => {
                alertDiv.innerHTML = '';
            }, 5000);
        }

        // Load codes on page load
        window.addEventListener('load', () => {
            loadAllCodes();
        });
    </script>
</body>
</html>
